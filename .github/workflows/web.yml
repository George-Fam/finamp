name: Build web

# The streaming-only web build, published as a release asset for hosts that serve it (e.g. swizzin's finamp app).
# Tag a commit web-r<N> to publish, or run it by hand: gh workflow run web.yml --ref <branch>
on:
  workflow_dispatch:
  push:
    tags:
      - 'web-r*'

permissions:
  contents: write

jobs:
  build-web:
    name: Build for web
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v6

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Get packages
      run: flutter pub get

    # Built for the site root; a host serving it under a path rewrites <base href> in index.html.
    - name: Build
      run: ./tools/build_web.sh --release

    - name: Package
      run: tar -C build/web -czf finamp-web.tar.gz .

    - uses: actions/upload-artifact@v4
      with:
        name: finamp-web
        path: finamp-web.tar.gz

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/web-r')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${GITHUB_REF_NAME}" finamp-web.tar.gz --title "Finamp web ${GITHUB_REF_NAME#web-}" --notes "Streaming-only web build of $(git rev-parse --short HEAD)."
